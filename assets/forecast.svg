<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <rect width="900" height="340" fill="#FAFAF8" rx="6"/>
  
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FAFAF8"/>
      <rect width="3" height="6" fill="#1F4FD8" opacity="0.8"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F4FD8" stop-opacity="0"/>
      <stop offset="90%" stop-color="#1F4FD8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1F4FD8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Headers -->
  <g font-family="Courier New, monospace" font-size="11" fill="#6B6B6B" letter-spacing="1.5" font-weight="bold">
    <text x="30" y="40">APP</text>
    <text x="200" y="40">EFFORT</text>
    <text x="520" y="40">WAITING ON PROVIDER</text>
  </g>
  <line x1="30" y1="55" x2="870" y2="55" stroke="#E6E4DF" stroke-width="1"/>

  <!-- Scanning Laser -->
  <rect x="30" y="55" width="2" height="260" fill="url(#scan)">
    <animate attributeName="x" from="30" to="870" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- GitHub -->
  <text x="30" y="100" font-family="Georgia, serif" font-size="22" fill="#111">GitHub</text>
  <text x="30" y="120" font-family="Arial, sans-serif" font-size="12" fill="#6B6B6B">Easy</text>
  <text x="200" y="100" font-family="Courier New, monospace" font-size="12" fill="#111">5-10 min</text>
  <rect x="200" y="70" width="80" height="12" fill="#111">
    <animate attributeName="width" from="0" to="80" dur="0.6s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="520" y="100" font-family="Courier New, monospace" font-size="12" fill="#9A9A9A">No wait</text>

  <!-- Slack -->
  <text x="30" y="170" font-family="Georgia, serif" font-size="22" fill="#111">Slack</text>
  <text x="30" y="190" font-family="Arial, sans-serif" font-size="12" fill="#6B6B6B">Medium</text>
  <text x="200" y="170" font-family="Courier New, monospace" font-size="12" fill="#111">30-60 min</text>
  <rect x="200" y="140" width="120" height="12" fill="#111">
    <animate attributeName="width" from="0" to="120" dur="0.6s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="520" y="170" font-family="Courier New, monospace" font-size="12" fill="#111">1-5 days</text>
  <rect x="520" y="140" width="70" height="12" fill="url(#hatch)" stroke="#1F4FD8">
    <animate attributeName="width" from="0" to="70" dur="0.6s" begin="0.4s" fill="freeze"/>
  </rect>

  <!-- Google -->
  <text x="30" y="240" font-family="Georgia, serif" font-size="22" fill="#111">Google</text>
  <text x="30" y="260" font-family="Arial, sans-serif" font-size="12" fill="#6B6B6B">Hard</text>
  <text x="200" y="240" font-family="Courier New, monospace" font-size="12" fill="#111">120-180 min</text>
  <rect x="200" y="210" width="170" height="12" fill="#111">
    <animate attributeName="width" from="0" to="170" dur="0.6s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="520" y="240" font-family="Courier New, monospace" font-size="12" fill="#111">14-42 days</text>
  <rect x="520" y="210" width="180" height="12" fill="url(#hatch)" stroke="#1F4FD8">
    <animate attributeName="width" from="0" to="180" dur="0.6s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- Salesforce -->
  <text x="30" y="310" font-family="Georgia, serif" font-size="22" fill="#111">Salesforce</text>
  <text x="30" y="330" font-family="Arial, sans-serif" font-size="12" fill="#6B6B6B">Hard</text>
  <text x="200" y="310" font-family="Courier New, monospace" font-size="12" fill="#111">60-120 min</text>
  <rect x="200" y="280" width="150" height="12" fill="#111">
    <animate attributeName="width" from="0" to="150" dur="0.6s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="520" y="310" font-family="Courier New, monospace" font-size="12" fill="#9A9A9A">No wait</text>
</svg>
