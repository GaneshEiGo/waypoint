<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <rect width="900" height="300" fill="#FAFAF8" rx="6"/>
  
  <defs>
    <!-- Scanning Mask -->
    <clipPath id="scanner">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="600" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
      </rect>
    </clipPath>
    
    <!-- Glowing Pixel -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#1F4FD8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1F4FD8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Technical Grid -->
  <g stroke="#E6E4DF" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
  </g>

  <!-- Revealed Text -->
  <g clip-path="url(#scanner)">
    <text x="60" y="110" font-family="Georgia, serif" font-size="72" fill="#111" letter-spacing="-1">Waypoint</text>
    <!-- Laser Line -->
    <line x1="0" y1="30" x2="0" y2="120" stroke="#1F4FD8" stroke-width="3">
      <animate attributeName="x1" from="0" to="600" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
      <animate attributeName="x2" from="0" to="600" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
    </line>
  </g>

  <text x="62" y="150" font-family="Arial, sans-serif" font-size="14" fill="#6B6B6B" letter-spacing="2" opacity="0">
    KNOW WHAT YOU'RE WALKING INTO.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- The Timeline Path with Flowing Dashes -->
  <path id="route" d="M 60 230 C 200 230 200 170 350 170 S 550 240 700 200 S 800 170 850 170" fill="none" stroke="#1F4FD8" stroke-width="2" stroke-dasharray="4 8" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- Nodes -->
  <rect x="55" y="225" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="345" y="165" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="695" y="195" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="845" y="165" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>

  <!-- Radar Pings -->
  <circle cx="60" cy="230" r="5" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="5;25" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="170" r="5" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="5;25" dur="2s" begin="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="5" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="5;25" dur="2s" begin="3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="3.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Labels -->
  <g font-family="Courier New, monospace" font-size="11" fill="#6B6B6B" text-anchor="middle" letter-spacing="1">
    <text x="60" y="270">MINUTES</text>
    <text x="350" y="210">HOURS</text>
    <text x="700" y="240">DAYS</text>
    <text x="850" y="210">WEEKS</text>
  </g>

  <!-- The Moving Pixel (Comet Trail) -->
  <g>
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
    <circle cx="-12" cy="0" r="4" fill="#1F4FD8" opacity="0.2"/>
    <circle cx="-6" cy="0" r="4" fill="#1F4FD8" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" stroke="#1F4FD8" stroke-width="1.5"/>
  </g>
</svg>
