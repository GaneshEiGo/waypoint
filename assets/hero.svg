<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0055FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="text-mask">
      <rect x="0" y="0" width="0" height="240">
        <animate attributeName="width" from="0" to="800" dur="1.2s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze" />
      </rect>
    </clipPath>
  </defs>
  <style>
    .bg { fill: #FFFFFF; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; font-weight: 700; font-size: 72px; fill: #000000; letter-spacing: -2.5px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; font-weight: 400; font-size: 18px; fill: #666666; letter-spacing: -0.5px; opacity: 0; animation: fadeUp 1s 1s forwards; }
    .path { fill: none; stroke: #E5E5E5; stroke-width: 2; }
    .particle { fill: #0055FF; }
    .glow-rect { fill: url(#glow); opacity: 0.6; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect class="bg" width="100%" height="100%"/>
  
  <g clip-path="url(#text-mask)">
    <text class="title" x="40" y="110">Waypoint.</text>
  </g>
  
  <text class="sub" x="40" y="150">Know the terrain before you build.</text>

  <path id="route" class="path" d="M 40 190 C 200 190, 250 130, 400 130 C 550 130, 600 190, 760 190" />
  
  <rect class="glow-rect" x="-100" y="100" width="200" height="100" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
  </rect>

  <circle class="particle" r="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>
  <circle class="particle" r="2" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>
  <circle class="particle" r="4" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
  </circle>
</svg>
