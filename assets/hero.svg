<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320" role="img" aria-label="Waypoint: Know what you're walking into.">
  <defs>
    <!-- Subtle Apple-style tactile pixel matrix background -->
    <pattern id="pixel-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="1.5" height="1.5" fill="#E6E4DF" />
    </pattern>
    <!-- Active blue pixel cluster for the traveler -->
    <g id="pixel-cluster">
      <rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#1F4FD8" />
      <rect x="-2" y="-2" width="4" height="4" fill="#FAFAF8" />
      <rect x="-11" y="-1.5" width="3" height="3" fill="#1F4FD8" opacity="0.65" />
      <rect x="-17" y="-1" width="2" height="2" fill="#1F4FD8" opacity="0.35" />
      <rect x="-22" y="-1" width="1.5" height="1.5" fill="#1F4FD8" opacity="0.15" />
    </g>
  </defs>

  <!-- Outer Canvas (#FAFAF8 warm paper, #E6E4DF 1px hairline, 4px radius) -->
  <rect x="0.5" y="0.5" width="899" height="319" rx="4" fill="#FAFAF8" stroke="#E6E4DF" stroke-width="1"/>
  <rect x="1" y="1" width="898" height="318" fill="url(#pixel-grid)" opacity="0.65"/>

  <!-- Top Telemetry Header Bar -->
  <line x1="0" y1="42" x2="900" y2="42" stroke="#E6E4DF" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#6B6B6B" letter-spacing="0.8">
    <rect x="40" y="16" width="6" height="6" fill="#2F5D50">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="54" y="25" font-weight="500" fill="#111111">WAYPOINT.SYS</text>
    <text x="155" y="25" fill="#9A9A9A">//</text>
    <text x="175" y="25">OAUTH INTEGRATION FORECASTER</text>
    <text x="860" y="25" text-anchor="end" fill="#1F4FD8" font-weight="500">[ 4 SEEDED · LIVE AGENT ]</text>
  </g>

  <!-- Kinetic Editorial Title: "Waypoint" + Pixel Assembly -->
  <g transform="translate(40, 108)">
    <!-- Decorative pixel matrix indicator left of title -->
    <g fill="#1F4FD8">
      <rect x="0" y="-42" width="4" height="4" opacity="0">
        <animate attributeName="opacity" values="0;1;0.25;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="6" y="-42" width="4" height="4" opacity="0.3">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="-36" width="4" height="4" opacity="0.6"/>
      <rect x="6" y="-36" width="4" height="4" fill="#111111"/>
    </g>

    <!-- Smooth Apple-curve slide & fade for Title -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <text x="20" y="0" font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', 'New York', Georgia, serif" font-size="64" font-weight="400" fill="#111111" letter-spacing="-1.2">
        Waypoint
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
      </text>
      
      <!-- Live Kinetic Subtitle Pill -->
      <g transform="translate(272, -30)">
        <rect x="0" y="0" width="318" height="26" rx="4" fill="#FFFFFF" stroke="#E6E4DF" stroke-width="1"/>
        <rect x="9" y="9" width="8" height="8" rx="1" fill="#1F4FD8">
          <animateTransform attributeName="transform" type="rotate" from="0 13 13" to="90 13 13" dur="3s" repeatCount="indefinite" calcMode="discrete"/>
        </rect>
        <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="13.5" font-weight="500" fill="#111111">
          Know what you’re walking into.
        </text>
      </g>
    </g>

    <text x="22" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" fill="#6B6B6B" letter-spacing="-0.1">
      An hour of hands-on setup and six weeks of provider review look identical from the outside. Not here.
    </text>
  </g>

  <!-- Divider Hairline before Interactive Telemetry Track -->
  <line x1="40" y1="158" x2="860" y2="158" stroke="#E6E4DF" stroke-width="1"/>

  <!-- Precision Ruler Ticks -->
  <g stroke="#E6E4DF" stroke-width="1">
    <line x1="90" y1="158" x2="90" y2="265" stroke-dasharray="2 3"/>
    <line x1="330" y1="158" x2="330" y2="265" stroke-dasharray="2 3"/>
    <line x1="590" y1="158" x2="590" y2="265" stroke-dasharray="2 3"/>
    <line x1="810" y1="158" x2="810" y2="265" stroke-dasharray="2 3"/>
  </g>

  <!-- Base Track (Muted) -->
  <path d="M 90 225 C 190 225, 230 190, 330 190 C 440 190, 480 230, 590 230 C 690 230, 720 185, 810 185" fill="none" stroke="#E6E4DF" stroke-width="2"/>

  <!-- Animated Dotted Flow Track -->
  <path d="M 90 225 C 190 225, 230 190, 330 190 C 440 190, 480 230, 590 230 C 690 230, 720 185, 810 185" fill="none" stroke="#1F4FD8" stroke-width="2" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- STAGE 1: MINUTES (GitHub) -->
  <g transform="translate(90, 225)">
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="#1F4FD8" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="12;28;28" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;28;28" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-6;-14;-14" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-6;-14;-14" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" fill="#2F5D50"/>
  </g>
  <!-- Stage 1 Tag -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" text-anchor="middle">
    <text x="90" y="256" font-size="12" font-weight="600" fill="#111111">MINUTES</text>
    <text x="90" y="272" font-size="11" fill="#2F5D50">5–10m · Self-serve</text>
  </g>

  <!-- STAGE 2: HOURS (Salesforce) -->
  <g transform="translate(330, 190)">
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="#1F4FD8" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.31;0.56;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="12;12;28;28" keyTimes="0;0.31;0.56;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;12;28;28" keyTimes="0;0.31;0.56;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-6;-6;-14;-14" keyTimes="0;0.31;0.56;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-6;-6;-14;-14" keyTimes="0;0.31;0.56;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" fill="#3A6B78"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" text-anchor="middle">
    <text x="330" y="256" font-size="12" font-weight="600" fill="#111111">HOURS</text>
    <text x="330" y="272" font-size="11" fill="#3A6B78">60–120m · Complex</text>
  </g>

  <!-- STAGE 3: DAYS (Slack) -->
  <g transform="translate(590, 230)">
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="#1F4FD8" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.64;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="12;12;28;28" keyTimes="0;0.64;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;12;28;28" keyTimes="0;0.64;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-6;-6;-14;-14" keyTimes="0;0.64;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-6;-6;-14;-14" keyTimes="0;0.64;0.88;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" fill="#B45309"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" text-anchor="middle">
    <text x="590" y="256" font-size="12" font-weight="600" fill="#111111">DAYS</text>
    <text x="590" y="272" font-size="11" fill="#B45309">1–5d · App review</text>
  </g>

  <!-- STAGE 4: WEEKS (Google) -->
  <g transform="translate(810, 185)">
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="#1F4FD8" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="12;12;30" keyTimes="0;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;12;30" keyTimes="0;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-6;-6;-15" keyTimes="0;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-6;-6;-15" keyTimes="0;0.92;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" fill="#1F4FD8"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" text-anchor="middle">
    <text x="810" y="256" font-size="12" font-weight="600" fill="#111111">WEEKS</text>
    <text x="810" y="272" font-size="11" fill="#1F4FD8">14–42d · Verification</text>
  </g>

  <!-- Moving Pixel Cluster Traveler (Direct Path = 100% GitHub Camo Compatible) -->
  <use href="#pixel-cluster">
    <animateMotion 
      path="M 90 225 C 190 225, 230 190, 330 190 C 440 190, 480 230, 590 230 C 690 230, 720 185, 810 185" 
      dur="6s" 
      repeatCount="indefinite" 
      rotate="auto"
      calcMode="spline"
      keyTimes="0;1"
      keySplines="0.25 0.1 0.25 1" />
  </use>

  <!-- Bottom Apple-Clean Status Bar -->
  <line x1="0" y1="292" x2="900" y2="292" stroke="#E6E4DF" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#6B6B6B">
    <text x="40" y="310">HANDOFF MARKERS: [AGENT CAN HELP] · [YOUR TURN] · [WAITING ON PROVIDER]</text>
    <text x="860" y="310" text-anchor="end" fill="#111111">EVIDENCE-BACKED RANGES</text>
  </g>
</svg>
