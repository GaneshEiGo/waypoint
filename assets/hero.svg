<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <!-- Crisp Light Background -->
  <rect width="900" height="300" fill="#FAFAF8" rx="6"/>

  <!-- Futuristic Isometric Grid -->
  <g stroke="#E6E4DF" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <!-- Diagonal grid lines -->
    <line x1="0" y1="300" x2="300" y2="0"/>
    <line x1="200" y1="300" x2="500" y2="0"/>
    <line x1="400" y1="300" x2="700" y2="0"/>
    <line x1="600" y1="300" x2="900" y2="0"/>
  </g>

  <!-- Glowing "Waypoint" Text drawn by the line -->
  <g font-family="Georgia, serif" font-size="80" fill="none" stroke="#1F4FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <text x="60" y="110" stroke-dasharray="600" stroke-dashoffset="600">
      Waypoint
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="2s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="fill" values="#FAFAF8;#111111" dur="0.5s" begin="2.5s" fill="freeze"/>
    </text>
  </g>

  <text x="62" y="145" font-family="Arial, sans-serif" font-size="14" fill="#6B6B6B" letter-spacing="2" opacity="0">
    KNOW WHAT YOU'RE WALKING INTO.
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
  </text>

  <!-- The Path -->
  <path id="route" d="M 50 240 C 200 240 200 160 350 160 S 550 240 700 200 S 800 160 850 160" fill="none" stroke="#1F4FD8" stroke-width="3" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Radar Rings -->
  <circle cx="50" cy="240" r="4" fill="none" stroke="#1F4FD8" stroke-width="2">
    <animate attributeName="r" values="4;30" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="160" r="4" fill="none" stroke="#1F4FD8" stroke-width="2">
    <animate attributeName="r" values="4;30" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="4" fill="none" stroke="#1F4FD8" stroke-width="2">
    <animate attributeName="r" values="4;30" dur="2s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Waypoint Nodes -->
  <rect x="44" y="234" width="12" height="12" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="344" y="154" width="12" height="12" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="694" y="194" width="12" height="12" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="844" y="154" width="12" height="12" fill="#FAFAF8" stroke="#111" stroke-width="2"/>

  <!-- Labels -->
  <g font-family="Courier New, monospace" font-size="12" fill="#6B6B6B" text-anchor="middle" letter-spacing="1">
    <text x="50" y="285">MINUTES</text>
    <text x="350" y="205">HOURS</text>
    <text x="700" y="245">DAYS</text>
    <text x="850" y="205">WEEKS</text>
  </g>

  <!-- Moving Data Packet (Comet) -->
  <g>
    <animateMotion dur="3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
    <circle cx="-20" cy="0" r="2" fill="#1F4FD8" opacity="0.1"/>
    <circle cx="-15" cy="0" r="4" fill="#1F4FD8" opacity="0.3"/>
    <circle cx="-8" cy="0" r="6" fill="#1F4FD8" opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#1F4FD8" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#1F4FD8"/>
  </g>
</svg>
