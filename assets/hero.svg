<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <!-- Background -->
  <rect width="900" height="320" fill="#0A0A0A" rx="6"/>
  
  <!-- Cyber Grid Background -->
  <g stroke="#1A1A1A" stroke-width="1" opacity="0.8">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
  </g>

  <!-- Kinetic Typography: WAYPOINT -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="4">
    <!-- W -->
    <text x="60" y="110" opacity="0">
      W
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- A -->
    <text x="135" y="110" opacity="0">
      A
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- Y -->
    <text x="195" y="110" opacity="0">
      Y
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- P -->
    <text x="255" y="110" opacity="0">
      P
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- O -->
    <text x="315" y="110" opacity="0">
      O
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- I -->
    <text x="375" y="110" opacity="0">
      I
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- N -->
    <text x="415" y="110" opacity="0">
      N
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
    <!-- T -->
    <text x="490" y="110" opacity="0">
      T
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0; 0 0" dur="0.4s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="60" y="160" font-family="Courier New, monospace" font-size="16" fill="#6B6B6B" letter-spacing="2" opacity="0">
    KNOW WHAT YOU'RE WALKING INTO.
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- The Route -->
  <path id="route" d="M 50 240 C 200 240 200 180 350 180 S 550 250 700 200 S 800 170 850 170" fill="none" stroke="#1F4FD8" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Radar Pings -->
  <circle cx="50" cy="240" r="4" fill="#1F4FD8">
    <animate attributeName="r" values="4;20" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="180" r="4" fill="#1F4FD8">
    <animate attributeName="r" values="4;20" dur="2s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="4" fill="#1F4FD8">
    <animate attributeName="r" values="4;20" dur="2s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Waypoints -->
  <rect x="45" y="235" width="10" height="10" fill="#111" stroke="#FFF" stroke-width="2"/>
  <rect x="345" y="175" width="10" height="10" fill="#111" stroke="#FFF" stroke-width="2"/>
  <rect x="695" y="195" width="10" height="10" fill="#111" stroke="#FFF" stroke-width="2"/>
  <rect x="845" y="165" width="10" height="10" fill="#111" stroke="#FFF" stroke-width="2"/>

  <!-- Labels -->
  <g font-family="Courier New, monospace" font-size="12" fill="#6B6B6B" text-anchor="middle" letter-spacing="1">
    <text x="50" y="280">MINUTES</text>
    <text x="350" y="220">HOURS</text>
    <text x="700" y="240">DAYS</text>
    <text x="850" y="210">WEEKS</text>
  </g>

  <!-- The Traveler (Comet Tail) -->
  <g>
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
    <circle cx="-15" cy="0" r="3" fill="#1F4FD8" opacity="0.3"/>
    <circle cx="-10" cy="0" r="4" fill="#1F4FD8" opacity="0.5"/>
    <circle cx="-5" cy="0" r="5" fill="#1F4FD8" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="2" fill="#1F4FD8" />
  </g>
</svg>
