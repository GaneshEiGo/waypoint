<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Waypoint</title>
  <desc id="heroDesc">Know what you are walking into. Minimal Apple-style interface where a stream of pixels travels from minutes to weeks.</desc>

  <defs>
    <!-- Cupertino Warm Alabaster Canvas -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBFBFD"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>

    <!-- Subtle Apple Card Elevation -->
    <filter id="iosShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1D1D1F" flood-opacity="0.05"/>
    </filter>

    <filter id="pillShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0066CC" flood-opacity="0.12"/>
    </filter>

    <!-- Ultra-Minimal Pixel Dot Grid -->
    <pattern id="pixelGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="1.5" height="1.5" fill="#D2D2D7" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Outer Squircle Frame -->
  <rect x="1" y="1" width="898" height="248" rx="22" fill="url(#appleBg)" stroke="#E5E5EA" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="248" rx="22" fill="url(#pixelGrid)"/>

  <!-- Ambient Floating Micro-Pixels (Minimal Background Motion) -->
  <g fill="#0066CC">
    <rect x="480" y="45" width="4" height="4" rx="1" opacity="0.2">
      <animate attributeName="y" values="55;30;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="620" y="75" width="3" height="3" fill="#1D1D1F" opacity="0.15">
      <animate attributeName="y" values="80;55;80" dur="5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="760" y="40" width="4" height="4" rx="1" opacity="0.25">
      <animate attributeName="y" values="48;24;48" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="835" y="95" width="3" height="3" fill="#2F5D50" opacity="0.25">
      <animate attributeName="y" values="100;76;100" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Top Right: iPhone Dynamic Island / Live Activity Telemetry Pill -->
  <g transform="translate(652, 22)" filter="url(#iosShadow)">
    <rect width="208" height="28" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <!-- Animated 2x2 Pixel Cluster Inside Pill -->
    <rect x="14" y="10" width="3.5" height="3.5" fill="#0066CC">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="19" y="10" width="3.5" height="3.5" fill="#0066CC">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="15" width="3.5" height="3.5" fill="#0066CC">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="19" y="15" width="3.5" height="3.5" fill="#0066CC">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="32" y="18" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="600" fill="#1D1D1F" letter-spacing="0.5">LIVE OAUTH FORECAST</text>
    <circle cx="192" cy="14" r="3.5" fill="#34C759">
      <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- KINETIC MOVING WORDMARK: "Waypoint" (Continuous Apple Fluid Wave) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="56" font-weight="700" fill="#1D1D1F" letter-spacing="-1.5">
    <text x="48" y="82">W<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="103" y="82">a<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="133" y="82">y<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.30s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="162" y="82">p<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.45s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="195" y="82">o<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.60s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="227" y="82">i<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="241" y="82">n<animate attributeName="y" values="82;77;82" dur="3.2s" begin="0.90s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <text x="273" y="82">t<animate attributeName="y" values="82;77;82" dur="3.2s" begin="1.05s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/></text>
    <!-- Accent Pixel Period -->
    <rect x="296" y="71" width="9" height="9" rx="2" fill="#0066CC">
      <animate attributeName="y" values="71;64;71" dur="3.2s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </rect>
  </g>

  <!-- Minimal Subtitle -->
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="400" fill="#86868B" letter-spacing="-0.2">
    Know what you&#8217;re walking into.
  </text>

  <!-- Subtle Tracked Pixel Line Under Header -->
  <line x1="50" y1="126" x2="310" y2="126" stroke="#E5E5EA" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="50" y="124.5" width="28" height="3" rx="1.5" fill="#0066CC">
    <animate attributeName="x" values="50;282;50" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </rect>

  <!-- THE TELEMETRY PATH (Minutes -> Hours -> Days -> Weeks) -->
  <!-- Soft Track -->
  <path d="M 80 190 C 210 190, 230 152, 340 152 S 520 205, 610 180 S 760 148, 820 152" fill="none" stroke="#E5E5EA" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Animated Pixel-Marching Line -->
  <path d="M 80 190 C 210 190, 230 152, 340 152 S 520 205, 610 180 S 760 148, 820 152" fill="none" stroke="#0066CC" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="120" to="0" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- Waypoint Node 1: minutes -->
  <g transform="translate(80, 190)">
    <rect x="-11" y="-11" width="22" height="22" rx="6" fill="none" stroke="#0066CC" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0.8;0;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="transform" values="scale(0.8);scale(1.8);scale(1.8)" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="-7" y="-7" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" rx="1" fill="#0066CC"/>
    <!-- Floating iOS Callout Pill -->
    <g transform="translate(0, -28)" filter="url(#pillShadow)">
      <rect x="-28" y="-12" width="56" height="20" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" fill="#0066CC">5&#8211;10m</text>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#86868B">minutes</text>
  </g>

  <!-- Waypoint Node 2: hours -->
  <g transform="translate(340, 152)">
    <rect x="-7" y="-7" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" rx="1" fill="#0066CC"/>
    <g transform="translate(0, -28)" filter="url(#pillShadow)">
      <rect x="-28" y="-12" width="56" height="20" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" fill="#1D1D1F">1&#8211;3h</text>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#86868B">hours</text>
  </g>

  <!-- Waypoint Node 3: days -->
  <g transform="translate(610, 180)">
    <rect x="-7" y="-7" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" rx="1" fill="#B45309"/>
    <g transform="translate(0, -28)" filter="url(#pillShadow)">
      <rect x="-28" y="-12" width="56" height="20" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="0" y="2" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" fill="#B45309">1&#8211;5d</text>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#86868B">days</text>
  </g>

  <!-- Waypoint Node 4: weeks -->
  <g transform="translate(820, 152)">
    <rect x="-7" y="-7" width="14" height="14" rx="4" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="2"/>
    <rect x="-2" y="-2" width="4" height="4" rx="1" fill="#FFFFFF"/>
    <g transform="translate(0, -28)" filter="url(#pillShadow)">
      <rect x="-32" y="-12" width="64" height="20" rx="10" fill="#1D1D1F"/>
      <text x="0" y="2" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" fill="#FFFFFF">2&#8211;6w</text>
    </g>
    <text x="0" y="28" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#1D1D1F">weeks</text>
  </g>

  <!-- MOVING PIXEL CONVOY (3 Crisp Trailing Pixels Travelling the Route) -->
  <!-- Trailing Micro-Pixel 3 -->
  <rect x="-2" y="-2" width="4" height="4" rx="1" fill="#0066CC" opacity="0.28">
    <animateMotion path="M 80 190 C 210 190, 230 152, 340 152 S 520 205, 610 180 S 760 148, 820 152" dur="6s" begin="0.36s" repeatCount="indefinite" rotate="auto"/>
  </rect>
  <!-- Trailing Micro-Pixel 2 -->
  <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.5" fill="#0066CC" opacity="0.55">
    <animateMotion path="M 80 190 C 210 190, 230 152, 340 152 S 520 205, 610 180 S 760 148, 820 152" dur="6s" begin="0.18s" repeatCount="indefinite" rotate="auto"/>
  </rect>
  <!-- Lead Precision Pixel -->
  <g>
    <animateMotion path="M 80 190 C 210 190, 230 152, 340 152 S 520 205, 610 180 S 760 148, 820 152" dur="6s" repeatCount="indefinite" rotate="auto"/>
    <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#0066CC" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
