<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Waypoint</title>
<desc id="d">Know what you are walking into. A pixel walks a dotted route from minutes to weeks, lighting each waypoint on the way.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect x="11" y="11" width="2" height="2" fill="#E9E9EE"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<path id="route" d="M70 350 C250 350 330 270 480 290 C630 310 690 230 830 240"/>
</defs>
<style>
.word{font:600 92px -apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-3.5px;fill:#1D1D1F;animation:rise 1.4s cubic-bezier(.16,1,.3,1) both}
.tag{font:400 24px -apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-.2px;fill:#6E6E73;animation:rise 1.4s .35s cubic-bezier(.16,1,.3,1) both}
.eye{font:500 12px 'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.4px;fill:#AEAEB2;animation:rise 1.2s .1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.px{fill:#E5E5EA;transform-box:fill-box;transform-origin:center;animation:lit 8.0s linear infinite}
@keyframes lit{0%{fill:#0071E3;transform:scale(1.9)}6%{fill:#0071E3;transform:scale(1.3)}34%{fill:#9CC8F5;transform:scale(1)}62%,100%{fill:#E5E5EA;transform:scale(1)}}
.node{fill:#fff;stroke:#1D1D1F;stroke-width:2}
.ring{fill:none;stroke:#0071E3;stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 8.0s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}12%,100%{opacity:0;transform:scale(3)}}
.lab{font:500 12px 'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;fill:#6E6E73;text-anchor:middle;text-transform:uppercase}
.fill{fill:#0071E3}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
