<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <!-- Clean Light Background -->
  <rect width="900" height="300" fill="#FAFAF8" rx="6"/>
  
  <!-- Futuristic Grid -->
  <g stroke="#E6E4DF" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
  </g>

  <!-- Kinetic Typography (Georgia Serif, 100% safe) -->
  <g font-family="Georgia, serif" font-size="72" font-weight="400" fill="#111" letter-spacing="-1">
    <text x="60" y="110" opacity="0">W
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.1s" fill="freeze"/>
    </text>
    <text x="130" y="110" opacity="0">A
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="185" y="110" opacity="0">Y
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="240" y="110" opacity="0">P
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="295" y="110" opacity="0">O
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="350" y="110" opacity="0">I
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="385" y="110" opacity="0">N
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.7s" fill="freeze"/>
    </text>
    <text x="455" y="110" opacity="0">T
      <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 20; 0 0" dur="0.5s" begin="0.8s" fill="freeze"/>
    </text>
  </g>

  <text x="62" y="150" font-family="Arial, sans-serif" font-size="14" fill="#6B6B6B" letter-spacing="2" opacity="0">
    KNOW WHAT YOU'RE WALKING INTO.
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- The Timeline Path -->
  <path id="path" d="M 60 220 C 200 220 200 170 350 170 S 550 240 700 200 S 800 170 850 170" fill="none" stroke="#1F4FD8" stroke-width="2" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Radar Pings -->
  <circle cx="60" cy="220" r="4" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="4;25" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="170" r="4" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="4;25" dur="2s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="200" r="4" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="4;25" dur="2s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Waypoint Nodes -->
  <rect x="55" y="215" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="345" y="165" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="695" y="195" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>
  <rect x="845" y="165" width="10" height="10" fill="#FAFAF8" stroke="#111" stroke-width="2"/>

  <!-- Labels (Courier New is 100% safe) -->
  <g font-family="Courier New, monospace" font-size="11" fill="#6B6B6B" text-anchor="middle" letter-spacing="1">
    <text x="60" y="260">MINUTES</text>
    <text x="350" y="210">HOURS</text>
    <text x="700" y="240">DAYS</text>
    <text x="850" y="210">WEEKS</text>
  </g>

  <!-- The Data Packet (Moving Pixels with Comet Trail) -->
  <g>
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s" rotate="auto">
      <mpath href="#path"/>
    </animateMotion>
    <!-- Trail -->
    <circle cx="-15" cy="0" r="2" fill="#1F4FD8" opacity="0.2"/>
    <circle cx="-10" cy="0" r="3" fill="#1F4FD8" opacity="0.5"/>
    <circle cx="-5" cy="0" r="4" fill="#1F4FD8" opacity="0.8"/>
    <!-- Core -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#1F4FD8" stroke-width="2"/>
  </g>
</svg>
