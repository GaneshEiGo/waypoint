<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <rect x="0" y="0" width="1000" height="300" fill="#FAFAF8" stroke="#E6E4DF" stroke-width="1" rx="6"/>
  
  <!-- Background Grid -->
  <g stroke="#E6E4DF" stroke-width="1" opacity="0.3">
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
  </g>

  <!-- Drawn Text (Waypoint) -->
  <text x="60" y="110" font-family="Georgia, serif" font-size="80" fill="#111" stroke="#111" stroke-width="1" stroke-dasharray="600" stroke-dashoffset="600">
    Waypoint
    <animate attributeName="stroke-dashoffset" from="600" to="0" dur="2s" fill="freeze" />
    <animate attributeName="fill" from="#FAFAF8" to="#111" dur="2s" fill="freeze" />
  </text>
  <text x="62" y="145" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6B6B6B" opacity="0">
    Know what you're walking into.
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1s" fill="freeze" />
  </text>

  <!-- The Path -->
  <path id="route" d="M 70 230 C 250 230, 250 170, 350 170 S 500 260, 600 220 S 800 160, 930 170" fill="none" stroke="#1F4FD8" stroke-width="2" stroke-dasharray="4 8" opacity="0.4"/>
  
  <!-- Timeline Nodes -->
  <g fill="#FAFAF8" stroke="#111" stroke-width="2">
    <rect x="63" y="223" width="14" height="14"/>
    <rect x="343" y="163" width="14" height="14"/>
    <rect x="593" y="213" width="14" height="14"/>
    <rect x="923" y="163" width="14" height="14"/>
  </g>

  <!-- Radar Pings -->
  <circle cx="70" cy="230" r="7" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;25" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="170" r="7" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;25" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="220" r="7" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;25" dur="2s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="170" r="7" fill="none" stroke="#1F4FD8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;25" dur="2s" begin="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Labels -->
  <g font-family="Courier New, monospace" font-size="12" fill="#6B6B6B" text-anchor="middle">
    <text x="70" y="265">MINUTES</text>
    <text x="350" y="205">HOURS</text>
    <text x="600" y="255">DAYS</text>
    <text x="930" y="205">WEEKS</text>
  </g>

  <!-- The Traveler (Data Packet with glow) -->
  <g>
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
    <circle cx="0" cy="0" r="12" fill="#1F4FD8" opacity="0.3" />
    <circle cx="0" cy="0" r="6" fill="#1F4FD8" opacity="0.6" />
    <circle cx="0" cy="0" r="3" fill="#111" />
  </g>
</svg>
