<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Flowing Data Pixel Pattern -->
    <pattern id="dot-flow" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="1.5" fill="#0EA5E9" />
      <circle cx="8" cy="8" r="1" fill="#8B5CF6" />
      <animate attributeName="x" from="0" to="12" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" from="0" to="12" dur="2s" repeatCount="indefinite" />
    </pattern>

    <linearGradient id="scanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <mask id="text-mask">
      <text x="500" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="140" font-weight="900" letter-spacing="-4" text-anchor="middle" fill="white">WAYPOINT</text>
    </mask>
  </defs>

  <rect width="1000" height="400" fill="url(#bg-grad)" />

  <!-- Subtle Moving Perspective Grid -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.3">
    <path d="M0 350 L1000 350 M0 300 L1000 300 M0 250 L1000 250 M0 200 L1000 200 M0 150 L1000 150" />
    <path d="M500 400 L100 0 M500 400 L300 0 M500 400 L500 0 M500 400 L700 0 M500 400 L900 0" />
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 20" dur="4s" repeatCount="indefinite" />
  </g>

  <!-- The Text: Flowing Dots Layer -->
  <rect width="1000" height="400" fill="url(#dot-flow)" mask="url(#text-mask)" opacity="0.9" />

  <!-- The Text: Solid Overlay for Readability -->
  <text x="500" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="140" font-weight="900" letter-spacing="-4" text-anchor="middle" fill="#0F172A" opacity="0.85">WAYPOINT</text>

  <!-- Scanner Beam passing through text -->
  <g mask="url(#text-mask)">
    <rect x="-200" y="0" width="150" height="400" fill="url(#scanner)" transform="skewX(-20)">
      <animate attributeName="x" from="-300" to="1200" dur="3.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <text x="500" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" fill="#475569" letter-spacing="6" text-anchor="middle">
    MAP THE INTEGRATION TERRAIN
    <animate attributeName="opacity" values="0.4; 1; 0.4" dur="4s" repeatCount="indefinite" />
  </text>

  <!-- Orbital Path for Moving Pixels -->
  <path id="orbit" d="M 150 200 C 150 50, 850 50, 850 200 C 850 350, 150 350, 150 200" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />

  <g filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="#0EA5E9" />
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit" /></animateMotion>
  </g>
  <g filter="url(#glow)">
    <circle cx="0" cy="0" r="4" fill="#8B5CF6" />
    <animateMotion dur="6s" begin="0.5s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit" /></animateMotion>
  </g>
  <g filter="url(#glow)">
    <circle cx="0" cy="0" r="3" fill="#38BDF8" opacity="0.6" />
    <animateMotion dur="6s" begin="1s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit" /></animateMotion>
  </g>
</svg>
