<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 52" width="232" height="52" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Open the live app</title>
<style>@font-face{font-family:WPSans;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.t{font:600 17px WPSans,Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-.3px;fill:#1D1D1F}
.ch{fill:none;stroke:#1D1D1F;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:nudge 2.4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.dot{transform-box:fill-box;transform-origin:center;animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="230" height="50" rx="25" fill="#fff" stroke="#1D1D1F" stroke-width="1.5"/>
<rect class="dot" x="24" y="22" width="7" height="7" rx="2" fill="#0A5CFF"/>
<text class="t" x="43" y="32">Open the live app</text>
<path class="ch" d="M196 20 L203 26 L196 32"/>
</svg>
