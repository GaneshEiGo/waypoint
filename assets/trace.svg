<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <rect width="900" height="360" fill="#FAFAF8" rx="6"/>
  
  <!-- UI Window -->
  <rect x="40" y="40" width="820" height="280" fill="#FFFFFF" rx="6" stroke="#E6E4DF" stroke-width="1"/>
  
  <!-- Top Bar -->
  <circle cx="60" cy="60" r="5" fill="#E6E4DF"/>
  <circle cx="80" cy="60" r="5" fill="#E6E4DF"/>
  <circle cx="100" cy="60" r="5" fill="#E6E4DF"/>
  <text x="800" y="65" font-family="Courier New, monospace" font-size="11" fill="#6B6B6B">Agent Pipeline</text>

  <!-- Prompt -->
  <text x="60" y="110" font-family="Courier New, monospace" font-size="15" fill="#6B6B6B">$ waypoint generate --app linear</text>
  
  <!-- Blinking Cursor -->
  <rect x="380" y="95" width="8" height="16" fill="#1F4FD8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Step 1 -->
  <g font-family="Courier New, monospace" font-size="14" fill="#111">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
    <text x="60" y="150" fill="#1F4FD8">[✓]</text>
    <text x="100" y="150">Searching documentation</text>
  </g>

  <!-- Step 2 -->
  <g font-family="Courier New, monospace" font-size="14" fill="#111">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.2s" fill="freeze"/>
    <text x="60" y="180" fill="#1F4FD8">[✓]</text>
    <text x="100" y="180">Extracting OAuth endpoints</text>
  </g>

  <!-- Step 3 -->
  <g font-family="Courier New, monospace" font-size="14" fill="#111">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.9s" fill="freeze"/>
    <text x="60" y="210" fill="#1F4FD8">[✓]</text>
    <text x="100" y="210">Verifying developer portal</text>
  </g>

  <!-- Step 4 -->
  <g font-family="Courier New, monospace" font-size="14" fill="#111">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.6s" fill="freeze"/>
    <text x="60" y="240" fill="#1F4FD8">[✓]</text>
    <text x="100" y="240">Drafting guide schema</text>
  </g>

  <!-- Step 5 (Success) -->
  <g font-family="Courier New, monospace" font-size="14" fill="#111">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.3s" fill="freeze"/>
    <text x="60" y="270" fill="#2F5D50">[✓]</text>
    <text x="100" y="270" fill="#2F5D50">Validating sources</text>
  </g>

  <!-- The Finish -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F4FD8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4s" fill="freeze"/>
    <text x="60" y="305">Guide ready to view.</text>
  </g>
</svg>
